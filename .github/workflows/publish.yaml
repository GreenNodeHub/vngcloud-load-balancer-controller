name: Release

# RELEASE="1.0.9" bash -c 'git tag $RELEASE && git push origin $RELEASE'

on:
  push:
    tags:
      - "*" # Triggers on version tags, e.g., 1.0.0

env:
  REPO: vcr.vngcloud.vn/81-vks-public

jobs:
  build_package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to the GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the vCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: vcr.vngcloud.vn
          username: ${{ secrets.VCR_USER_PRO }}
          password: ${{ secrets.VCR_PASSWORD_PRO }}
      
      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

      - name: Debug
        run: echo ${{ github.ref_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          push: true
          build-args: |
            VERSION=v${{ github.ref_name }}
            COMMIT=${{ env.COMMIT_SHORT_SHA }}
          # platforms: linux/amd64
          # outputs: type=registry
          tags: |
            ghcr.io/vngcloud/vngcloud-load-balancer-controller:${{ github.sha }}
            ghcr.io/vngcloud/vngcloud-load-balancer-controller:v${{ github.ref_name }}
            ${{ env.REPO }}/vngcloud-load-balancer-controller:${{ github.sha }}
            ${{ env.REPO }}/vngcloud-load-balancer-controller:v${{ github.ref_name }}
          # target: vngcloud-load-balancer-controller
      
      - name: Push charts
        env:
          CHANGED_CHARTS: "charts/vngcloud-load-balancer-controller"
        run: |
          echo "$CHANGED_CHARTS"
          echo ${{ github.workspace }}
          cd ${{ github.workspace }} && ./push_tgz.sh oci://${{ env.REPO }}/vks-helm-charts $CHANGED_CHARTS ${{ github.ref_name }}

  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "${{ github.ref_name }}" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${{ github.ref_name }}" \
              --generate-notes
