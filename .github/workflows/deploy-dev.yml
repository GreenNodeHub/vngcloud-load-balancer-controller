name: Deploy DEV

# develop is a sandbox: merge a feature branch into it to get a testable image.
# EVERY push to develop builds - the "[build]" commit-message marker is gone.
# develop is never merged back into main; reset it periodically:
#   git push --force origin main:develop
#
# Production is not built here. Releases still come from a tag on main via publish.yaml.

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      chart_version: ${{ steps.tag.outputs.chart_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: tag
        run: |
          set -euo pipefail
          # One version per build, and it has to actually upgrade the CRDs.
          #
          # The controller labels the CRDs it installs with the CHART version and only updates a
          # CRD whose label is lower. But the two sides of that comparison are parsed by different
          # functions: the label on the cluster goes through versioncheck.Version, which STRIPS a
          # prerelease unless it contains rc/beta/alpha/snapshot, while the chart version keeps
          # its prerelease. So a chart of 0.4.0-dev.<sha> is written to the label, read back as
          # plain 0.4.0, and 0.4.0 outranks 0.4.0-dev.<anything> - the next dev build is skipped,
          # silently, and the API server strips every status field added since.
          #
          # That is why this is numbered in the PATCH and carries no prerelease at all:
          #
          #   Chart.yaml 0.3.24  ->  0.4.<run number>
          #
          # above every 0.3.x release, below a real 0.4.x, and strictly increasing build over
          # build. pkg/k8s/apis/crdhelpers/schema_version_test.go pins the comparison.
          #
          # The commit is not in the version any more, so it is carried two other ways: the image
          # gets a second tag of the short sha (build-and-push), and the controller prints
          # commit + chartVersion in its "build info" line at startup.
          base=$(grep -E '^version:' charts/vngcloud-load-balancer-controller/Chart.yaml \
                 | head -1 | sed -E 's/^version:[[:space:]]*"?([0-9]+\.[0-9]+\.[0-9]+)"?.*/\1/')
          if [ -z "$base" ]; then
            echo "::error::could not read version from Chart.yaml"
            exit 1
          fi
          major=${base%%.*}
          minor=$(echo "$base" | cut -d. -f2)
          chart="${major}.$((minor + 1)).${GITHUB_RUN_NUMBER}"
          echo "Chart.yaml base : $base"
          echo "commit          : ${GITHUB_SHA::7}"
          echo "dev version     : $chart"
          echo "tag=v${chart}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${chart}" >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-and-push:
    needs: [prepare, ci]
    uses: ./.github/workflows/build-and-push.yml
    with:
      environment: develop
      tag: ${{ needs.prepare.outputs.tag }}
      chart_version: ${{ needs.prepare.outputs.chart_version }}
    secrets: inherit
