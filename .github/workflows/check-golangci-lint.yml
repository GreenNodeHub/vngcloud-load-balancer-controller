# golangci-lint run
name: golangci-lint
on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  golangci:
    name: lint-codebase
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          args: --timeout 15m0s --verbose
