# govulncheck ./...
name: govulncheck
on: push

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: contains(github.event.head_commit.message, '[build]')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Scan for Vulnerabilities in Code
        # Pinned to master HEAD: latest v1.0.4 tag transitively pulls actions/checkout@v4.1.1
        # and actions/setup-go@v5.0.0 (Node 20). master HEAD pins them to v6.0.2 / v6.2.0 (Node 24).
        # Switch back to a tagged release once upstream cuts v1.0.5+.
        uses: golang/govulncheck-action@31f7c5463448f83528bd771c2d978d940080c9fd # master @ 2026-02-26
        with:
          go-version-input: 1.25.11
          go-package: ./...
