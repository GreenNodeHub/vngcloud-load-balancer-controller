name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'Pipfile'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. v0.1.0, dev)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pipenv && pipenv install

      - name: Determine version
        id: version
        run: |
          # Push to main → "dev" (always overwritten, never aliased to "latest").
          # workflow_dispatch with explicit version → that version (rare; tagged releases
          # are auto-published via .github/workflows/publish.yaml).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: Deploy docs with mike
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          pipenv run mike deploy "$VERSION" --push
