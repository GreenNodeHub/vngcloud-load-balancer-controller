kubernetesClusterDomain: cluster.local
manager:
  manager:
    args:
    - --metrics-bind-address=:8443
    - --leader-elect
    - --health-probe-bind-address=:8081
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    image:
      repository: vcr.vngcloud.vn/81-vks-public/vngcloud-load-balancer-controller
      tag: "v0.2.14" # release
    imagePullPolicy: Always
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
  replicas: 1
  serviceAccount:
    annotations: {}
  # -- Affinity configuration for pod scheduling
  affinity: {}
    # Example pod anti-affinity to prevent pods from being scheduled on the same host as cilium
    # podAntiAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     - topologyKey: kubernetes.io/hostname
    #       labelSelector:
    #         matchLabels:
    #           k8s-app: cilium
  # -- Node selector for pod scheduling
  nodeSelector: {}
    # Example: schedule only on Linux nodes
    # kubernetes.io/os: linux
  # -- Tolerations for pod scheduling to nodes with taints
  tolerations:
    - operator: Exists
metricsService:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  type: ClusterIP
mysecret:
  maxConcurrentReconciles: 5
  cluster:
    isRunRemote: false
    clusterID: ""
    namespace: ""
    region: ""
  global:
    clientID: ""
    clientSecret: ""
    identityURL: https://iamapis.vngcloud.vn/accounts-api
    vserverURL: https://hcm-3.api.vngcloud.vn/vserver
